---
name: Add New Nova CLI Entry

on: # yamllint disable-line rule:truthy
  repository_dispatch:
    types: [add-nova-cli-entry]

jobs:
  add-nova-cli-entry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.client_payload.version }}
      FILE_HASH: ${{ github.event.client_payload.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the PAT may bypass the org ruleset on main, and (unlike GITHUB_TOKEN)
          # its push triggers the "Build Winget Source" workflow
          token: ${{ secrets.PAT_FOR_UPDATE_ACTION }}
      - uses: astral-sh/setup-uv@v5

      - name: Verify Parameters
        run: |
          echo "Version: ${VERSION}"
          echo "File Hash: ${FILE_HASH}"

          if [ -z "${VERSION}" ]; then
            echo "missing field 'version'"
            exit 1
          fi

          if [ -z "${FILE_HASH}" ]; then
            echo "missing field 'hash'"
            exit 1
          fi

      - name: Install Python
        run: |
          cd scripts
          uv python install

      - name: Create New Entry
        env:
          # somehow env vars where missing in the yq action, so we reassign them
          VERSION: ${{ github.event.client_payload.version }}
          FILE_HASH: ${{ github.event.client_payload.hash }}
        run: |
          cd scripts
          uv run 01-create-entry.py $VERSION $FILE_HASH

      - name: Commit to main
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add manifests/*
          git commit -m "Update cli to ${VERSION}"
          git push origin HEAD:main
